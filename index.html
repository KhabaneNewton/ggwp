<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="images/logo.ico" type="image/x-icon" />
  <title>Kuis Teknologi & Antariksa</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #070808, #00aeff);
      margin: 0;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      text-align: center;
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
    }

    p {
      font-weight: 400;
      font-size: 1rem;
      margin-bottom: 20px;
      color: #333;
    }

    input[type="text"] {
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      width: 80%;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      background-color: #6c63ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #5a52e0;
    }

    #popup,
    #wrong-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .popup-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <p id="question">Memuat pertanyaan...</p>
    <input type="text" id="answer-input" placeholder="Ketik jawabanmu di sini..." />
    <button onclick="checkAnswer()">Jawab</button>
    <p><a href="Error.html">Tidak bisa menjawab? Klik di sini</a></p>
  </div>

  <div id="popup">
    <div class="popup-content">
      <p id="success-msg">Benar! Jawabanmu tepat.</p>
      <p><a href="index.html"> klik di sini</a></p>
    </div>
  </div>

  <div id="wrong-popup">
    <div class="popup-content">
      <p id="fail-msg">Salah. Coba pertanyaan berikutnya!</p>
    </div>
  </div>

  <script>
    const questions = [
      { q: "Apa nama teleskop luar angkasa yang diluncurkan NASA pada tahun 2021?", a: "james webb" },
      { q: "Apa lapisan paling luar dari planet Bumi?", a: "kerak bumi" },
      { q: "Teknologi nirkabel yang memungkinkan koneksi antar perangkat disebut?", a: "bluetooth" },
      { q: "Planet terbesar dalam tata surya kita adalah?", a: "jupiter" },
      { q: "Proses meletusnya gunung berapi disebut?", a: "erupsi" },
      { q: "Apa nama robot penjelajah Mars milik NASA yang mendarat tahun 2021?", a: "perseverance" },
      { q: "Batuan beku yang terbentuk dari lava disebut?", a: "batuan basalt" }
    ];

    let currentQuestion;

    function setQuestion() {
      currentQuestion = questions[Math.floor(Math.random() * questions.length)];
      document.getElementById("question").innerText = currentQuestion.q;
    }

    function checkAnswer() {
      const input = document.getElementById("answer-input");
      const userAnswer = input.value.toLowerCase().trim();

      if (userAnswer === currentQuestion.a) {
        document.getElementById("popup").style.display = "flex";
        setTimeout(() => {
          document.getElementById("popup").style.display = "none";
          setQuestion();
        }, 2500);
      } else {
        document.getElementById("wrong-popup").style.display = "flex";
        setTimeout(() => {
          document.getElementById("wrong-popup").style.display = "none";
          setQuestion();
        }, 2000);
      }

      input.value = "";
    }

    // Tampilkan pertanyaan pertama saat halaman dimuat.
    setQuestion();
  </script>
</body>

</html>
